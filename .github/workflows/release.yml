name: release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build Ubuntu 24.04 LTS (Noble) Packages
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
      - name: Build
        run: make all
      - name: Generate release ${{ github.ref_name }} changelog
        run: awk '/^## ${{ github.ref_name }}/' RS= CHANGELOG.md > CHANGELOG-${{ github.ref_name }}.md
